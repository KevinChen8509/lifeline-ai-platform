# Trino ClickHouse Catalog - 源 B 数仓（订单行为）
# 使用 Trino 435 自带 clickhouse 插件（HTTP 协议 8123）
#   mysql 协议 (9004): mysql-connector 8.x 报 buffer length 错误
#   postgres 协议 (9005): ClickHouse 不支持 extended query
#   HTTP (8123): 原生协议，最稳
connector.name=clickhouse
connection-url=jdbc:clickhouse://clickhouse:8123/default
connection-user=default
connection-password=click123
clickhouse.map-string-as-varchar=true
