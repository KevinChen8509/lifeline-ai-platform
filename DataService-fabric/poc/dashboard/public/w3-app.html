<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Week 3 · AI Agent 对比 — Data Fabric PoC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css" />
  <style>
    :root {
      --fabric-green: #10b981;
      --raw-red: #ef4444;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .page-header {
      padding: 20px 32px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }
    .page-header .sub {
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 2px;
    }
    .page-header a {
      color: var(--fabric-green);
      text-decoration: none;
      font-size: 13px;
    }
    .container {
      padding: 24px 32px;
      max-width: 1600px;
      margin: 0 auto;
    }
    .question-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .q-btn {
      padding: 8px 14px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
    }
    .q-btn:hover { border-color: #60a5fa; background: #1e3a5f; }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
    .pane {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 16px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
    }
    .pane.fabric { border-top: 3px solid var(--fabric-green); }
    .pane.raw    { border-top: 3px solid var(--raw-red); }
    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .pane-title { font-size: 15px; font-weight: 600; }
    .pane-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .pane-tag.fabric { background: rgba(16,185,129,.15); color: var(--fabric-green); }
    .pane-tag.raw    { background: rgba(239,68,68,.15);  color: var(--raw-red); }
    .pane-meta {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      gap: 14px;
      margin-bottom: 10px;
    }
    .pane-meta span b { color: var(--text); font-weight: 500; }
    .answer-box {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      overflow: auto;
      max-height: 480px;
    }
    .answer-box.empty { color: var(--text-dim); font-style: italic; }
    .answer-box.err  { color: var(--raw-red); }
    .pii-flag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 6px;
      background: rgba(239,68,68,.2);
      color: var(--raw-red);
      border-radius: 4px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .pii-flag.safe {
      background: rgba(16,185,129,.2);
      color: var(--fabric-green);
    }
    .loader {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--text-dim);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .input-row input {
      flex: 1;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .input-row input:focus { border-color: #60a5fa; }
    .input-row button {
      padding: 10px 22px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .input-row button:disabled { background: #475569; cursor: not-allowed; }
    .legend {
      margin-top: 20px;
      padding: 12px 16px;
      background: var(--card-bg);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.7;
    }
    .legend b { color: var(--text); }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.min.js"></script>
  <script src="/w3-app.js"></script>
</body>
</html>
