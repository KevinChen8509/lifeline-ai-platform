name: DataService-fabric CI

# Workflow 文件必须在仓库根 .github/workflows/ 下，GitHub Actions 才会识别。
# 本 repo 根是 E:/Agentic/，DataService-fabric 是其中一个子项目。
on:
  push:
    branches: [datafabric-week*, master]
    paths:
      - 'DataService-fabric/poc/data-service/**'
      - '.github/workflows/data-service-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'DataService-fabric/poc/data-service/**'

jobs:
  data-service-tests:
    name: data-service / Maven test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DataService-fabric/poc/data-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven test
        run: mvn test -B

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: DataService-fabric/poc/data-service/target/surefire-reports/*
          if-no-files-found: ignore

      - name: Upload Pact contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: DataService-fabric/poc/data-service/target/pacts/*
          if-no-files-found: ignore
